# Serving rules that matter for a PWA, and nothing else.
#
# The service worker is the version: its cache name carries the build hash, so the shell and the
# worker must never be served stale (an offline install could otherwise keep an old build forever),
# while everything else is safe to cache hard because a new worker will replace the old cache.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # A `types` block at this level REPLACES the inherited type map rather than adding to it, so the
    # standard map is re-included here first. Without this line everything except the .webmanifest is
    # served as application/octet-stream, which stops a browser rendering the page at all and stops it
    # registering the service worker. That was caught by running the built image and reading the
    # headers back, and not by anything upstream of it.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_types text/css application/javascript application/json
               application/manifest+json image/svg+xml;

    # The worker itself, the shell it caches, and the identity file the settings sheet reads.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /build-info.json {
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex";
    }

    # Content-hashed JS and CSS bundles emitted by Vite into /assets/ can be cached immutably.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(?:js|css|png|svg|ico|webmanifest)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Serve licence and notice texts inline as readable plain text.
    location ~ ^/(LICENSE|NOTICE)\.txt$ {
        default_type text/plain;
        add_header X-Robots-Tag "noindex";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
